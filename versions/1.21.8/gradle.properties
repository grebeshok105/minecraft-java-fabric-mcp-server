# Version subproject: Minecraft 1.21.8
#
# 1.21.x ships obfuscated JARs. We map with Mojang's official mappings (Mojmap)
# rather than Yarn — Mojmap names match what's used in 26.1+ (where the JAR is
# unobfuscated), so the same source compiles against the whole matrix.

deps.minecraft=1.21.8
deps.fabric_loader=0.19.3
deps.fabric_api=0.136.1+1.21.8

deps.mappings_type=mojmap

# Loom 1.17.17 per the spike's stack pins (issue #43); fallback 1.16-SNAPSHOT
# only if configuration/build fails for a reason traceable to Loom itself.
deps.loom=1.17.17

java.toolchain.version=21
