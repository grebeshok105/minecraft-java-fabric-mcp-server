# Version subproject: Minecraft 1.21.1
#
# 1.21.x ships obfuscated JARs. We map with Mojang's official mappings (Mojmap)
# rather than Yarn — Mojmap names match what's used in 26.1+ (where the JAR is
# unobfuscated), so the same source compiles against the whole matrix.
#
# The loader/API pins deliberately match the Codex Superheroes runtime
# (Codex-Superheroes/gradle.properties): this target exists so the MCP mod can
# load in the same Fabric instance as Codex, so its depends constraints must
# accept exactly the stack Codex is built against.

deps.minecraft=1.21.1
deps.fabric_loader=0.19.2
deps.fabric_api=0.116.12+1.21.1

deps.mappings_type=mojmap

# Loom 1.16-SNAPSHOT — the same line Codex builds 1.21.1 with, and the same pin
# the 1.21.11 sibling target uses.
deps.loom=1.16-SNAPSHOT

java.toolchain.version=21
